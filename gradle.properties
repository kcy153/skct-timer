org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# 프로젝트 경로("타이머")에 한글이 포함돼 있어서 AGP의 비-ASCII 경로 체크에 걸림 —
# 네이티브(NDK) 코드가 없는 프로젝트라 안전하게 우회 가능 (에너지포커싱 프로젝트와 동일 사유)
android.overridePathCheck=true

# 이 PC는 RAM이 넉넉하지 않아(7GB) 빌드 데몬이 OOM으로 죽는 문제가 있었음 — 메모리를
# 보수적으로 잡고, 데몬을 계속 띄워두지 않고 매번 새로 시작해서 누적 메모리 압박을 피함
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvm.options=-Xmx768m
